name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python3 -m compileall -q skills _system tests

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  browser:
    runs-on: ubuntu-latest
    env:
      SEED_ME_REQUIRE_BROWSER: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt

      - name: Install pinned Playwright
        run: python -m pip install -r tests/requirements-browser.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements-browser.txt') }}

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install system dependencies for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run browser tests (a skip is a failure)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_seed_me_viewer.py' -v 2>&1 | tee browser-tests.log
          if grep -Eq '\.\.\. skipped|skipped=' browser-tests.log; then
            echo "::error::Browser tests were skipped; SEED_ME_REQUIRE_BROWSER=1 forbids that"
            exit 1
          fi
